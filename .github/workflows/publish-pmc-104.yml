name: Publish PMC Update 1.0.4

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-pmc-104.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built update artifact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-2da0-820e-b5f4-6739b59c846a/raw?se=2026-09-04T01%3A40%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=1ef5abd2-2064-548e-8694-1e2376b1cf0d&skoid=68f37fa7-4e08-478b-93f3-c72d563a0ab3&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-03T20%3A53%3A36Z&ske=2026-09-04T20%3A53%3A36Z&sks=b&skv=2026-02-06&sig=on/aVHWqilz0kO/XU1qdYcwsEC5EKqEXPa2anYieaTE%3D'
          Invoke-WebRequest -Uri $url -OutFile artifact.zip -UseBasicParsing
          Expand-Archive artifact.zip -DestinationPath artifact -Force
          Get-ChildItem artifact -Force
          if (-not (Test-Path 'artifact\PMC_Ponto_Checker_1.0.4.zip')) { throw 'Update ZIP not found in artifact.' }

      - name: Publish package and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $releaseDir='pmc-updates\releases\1.0.4'
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          $pkg=Join-Path $releaseDir 'PMC_Ponto_Checker_1.0.4.zip'
          Copy-Item 'artifact\PMC_Ponto_Checker_1.0.4.zip' $pkg -Force
          $hash=(Get-FileHash $pkg -Algorithm SHA256).Hash.ToLower()
          $manifest=[ordered]@{
            version='1.0.4'
            required=$true
            min_updater_version='1.0.0'
            package='releases/1.0.4/PMC_Ponto_Checker_1.0.4.zip'
            sha256=$hash
          } | ConvertTo-Json
          $manifest | Set-Content 'pmc-updates\manifest.json' -Encoding UTF8
          Write-Host "Package SHA256=$hash"
          Write-Host $manifest

      - name: Commit update to public update channel
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'PMC Update Bot'
          git config user.email 'pmc-update-bot@users.noreply.github.com'
          git add -f pmc-updates/manifest.json pmc-updates/releases/1.0.4/PMC_Ponto_Checker_1.0.4.zip
          git commit -m 'Publish PMC Ponto Checker 1.0.4 [skip ci]'
          git push origin HEAD:master
